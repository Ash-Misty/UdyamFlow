services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { const s = rs.status(); quit(s.myState === 1 ? 0 : 1); } catch (e) { rs.initiate({_id:'rs0', members:[{_id:0, host:'mongo:27017'}]}); quit(1); }"
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/udyamflow?replicaSet=rs0
      JWT_SECRET: local-demo-secret-change-before-deployment
      CLIENT_ORIGIN: http://localhost:5173
      NODE_ENV: production
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  mongo-data:
